<!-- PWA basics (options feature): installable and full screen on phones, no service worker, so nothing is cached or fetched behind your back. Icons come from tools/make-icons.mjs. -->
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  html, body { margin: 0; height: 100%; background: #050304; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* game.js sizes and places the canvas (and lays the touch pad out around it), so the page never scrolls or zooms */
  canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; touch-action: none; }
  #share { position: fixed; z-index: 10; left: 50%; top: 0; transform: translateX(-50%); box-sizing: border-box; min-width: 132px; min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 1.1em; white-space: nowrap;
    background: #111; color: #fff; border: 2px solid #c9a24a; border-radius: 6px; font: bold 18px Impact, Haettenschweiler, "Arial Narrow", sans-serif; letter-spacing: 0.06em; text-decoration: none; box-shadow: 0 0 18px rgba(201,162,74,0.45); }
  #share:hover, #share:focus { background: #c9a24a; color: #111; }
  #share[hidden] { display: none; }
  /* on-screen touch controls (built by game.js): solid in their own block under the game in portrait (.stk), faint over the playfield in landscape (.ovl) */
  #pad { position: fixed; inset: 0; z-index: 5; pointer-events: none; touch-action: none; --o: 0.95; font: bold 20px Impact, Haettenschweiler, "Arial Narrow", sans-serif; letter-spacing: 0.04em; }
  #pad.ovl { --o: 0.55; }
  #pad[hidden], #pad [hidden] { display: none !important; }
  #pad .tb, #dpad, #pills .mb { pointer-events: auto; touch-action: none; -webkit-user-select: none; user-select: none; }
  #pad .tb { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 3px solid rgba(255,255,255,0.8); background: var(--c); color: #111; font-size: 26px; opacity: var(--o); }
  #pad .tb.on { opacity: 1; transform: scale(0.92); }
  #dpad { position: absolute; box-sizing: border-box; border-radius: 50%; background: rgba(255,255,255,0.14); border: 3px solid rgba(255,255,255,0.45); opacity: var(--o); }
  #dpad i { position: absolute; width: 26%; height: 26%; background: rgba(255,255,255,0.65); pointer-events: none; }
  #dpad i.on { background: #ffd23f; }
  #dpad .u { left: 37%; top: 8%; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  #dpad .d { left: 37%; bottom: 8%; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  #dpad .l { left: 8%; top: 37%; clip-path: polygon(0 50%, 100% 0, 100% 100%); }
  #dpad .r { right: 8%; top: 37%; clip-path: polygon(0 0, 100% 50%, 0 100%); }
  #pills { position: absolute; display: flex; gap: 8px; pointer-events: none; }
  #pad.stk #pills { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  #pad.ovl #pills { flex-direction: column; }
  #pills .mb { box-sizing: border-box; flex: 1 1 0; min-width: 64px; max-width: 170px; height: 46px; display: flex; align-items: center; justify-content: center; padding: 0 8px; white-space: nowrap; border: 3px solid #c9a24a; border-radius: 10px; background: rgba(17,17,17,0.92); color: #fff; font-size: 17px; }
  #pad.ovl #pills .mb { flex: none; max-width: none; height: 40px; padding: 0 2px; font-size: 15px; }
  #pills .mb.on { background: #c9a24a; color: #111; }
  #pad .hint { position: absolute; left: 12px; right: 12px; text-align: center; color: #8d8576; font-size: 14px; font-weight: normal; letter-spacing: 0.06em; line-height: 1.3; pointer-events: none; }
  #pad .hint.tip { color: #e8e0cc; }   /* the fight tips under the game in portrait are real instructions: brighter than the "turn your phone" nudge */
  /* SHARE ON X when the touch layout owns the screen: sized and placed by game.js next to the menu buttons (which also shrinks any label that would overflow) */
  #share.tp { transform: none; min-width: 0; min-height: 46px; padding: 0 6px; border-width: 3px; border-radius: 10px; font-size: 17px; background: rgba(17,17,17,0.92); box-shadow: none; }
  #share.tp.ovl { min-height: 40px; padding: 0 2px; font-size: 15px; }
</style>
