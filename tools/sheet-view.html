<!doctype html><html><head><meta charset="utf-8"><title>sheet view</title>
<style>body{margin:0;background:#0e0c16}canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="../sprites.js"></script>
<script>
// tools/sheet-view.html?id=tibo&z=2  (id=all stacks fighters)  &rows=idle,punch  limits the rows, &f=0,2,4 limits the frame columns
const q=new URLSearchParams(location.search);const id=q.get('id')||'tibo';const z=+(q.get('z')||2);
buildSheets();
const ids=id==='all'?Object.keys(LOOK):[id];
const cols=q.get('f')?q.get('f').split(',').map(Number):Array.from({length:MAXF},(_,i)=>i);
const rows=q.get('rows')?q.get('rows').split(',').map(n=>ANIM_ROW[n]):ANIMS.map((a,i)=>i);
const cv=document.getElementById('c');cv.width=FW*cols.length*z;cv.height=FH*rows.length*z*ids.length;const c=cv.getContext('2d');c.imageSmoothingEnabled=false;
c.fillStyle='#0e0c16';c.fillRect(0,0,cv.width,cv.height);
ids.forEach((k,i)=>rows.forEach((r,ri)=>{const y=(i*rows.length+ri)*FH*z;
 cols.forEach((f,ci)=>{c.fillStyle=(r+ci)%2?'#171428':'#120f20';c.fillRect(ci*FW*z,y,FW*z,FH*z);
  if(f<ANIMS[r].f){c.drawImage(SHEETS[k],f*FW,r*FH,FW,FH,ci*FW*z,y,FW*z,FH*z);c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(ci*FW*z,y+(FEET+1)*z,FW*z,1);}});
 c.fillStyle='#8f8aa8';c.font='12px monospace';c.fillText(k+' '+ANIMS[r].n,4,y+12);}));
</script></body></html>
