<script>
// ---- bus.js ----
// ===== AGENT BRAWL extension layer, part 1: BUS (events) and HOOKS (extension points). Loaded first, right after the inline W/H script. =====
// Owner: scaffold. Feature files talk to the engine only through BUS, HOOKS, SETTINGS (settings.js) and MODES (modes.js); the contracts are listed in docs/ARCHITECTURE.md.
//   BUS   fire-and-forget notifications. BUS.on(name, fn) returns an unsubscribe function. BUS.once(name, fn), BUS.off(name, fn), BUS.emit(name, payload), BUS.count(name).
//   HOOKS places where a feature changes what the engine does. HOOKS.add(name, fn, order = 0) returns a remove function (lower order runs first, ties run in registration order).
//         HOOKS.run(name, ...args)           call every handler (draw and update points)
//         HOOKS.filter(name, value, ...args) pass value through every handler, each returns the new value (undefined keeps it); the engine uses what comes out
//         HOOKS.collect(name, ...args)       gather what the handlers return (single items or arrays) into one flat array (menu items)
//         HOOKS.has(name)                    true when something is registered
// A handler that throws is caught and logged once per name (console.error, so the test run fails on it); the game keeps going.
// With nothing registered every call returns at once: the engine can call them from its hot paths.
'use strict';
const BUS = (() => {
  const subs = Object.create(null), warned = Object.create(null);
  const bad = (name, e) => { if (warned[name]) return; warned[name] = 1; try { console.error('BUS handler for "' + name + '" threw: ' + (e && e.stack || e)); } catch (x) { /* no console */ } };
  function on(name, fn) { (subs[name] || (subs[name] = [])).push(fn); return () => off(name, fn); }
  function off(name, fn) { const l = subs[name]; if (!l) return; const i = l.indexOf(fn); if (i >= 0) l.splice(i, 1); }
  function once(name, fn) { const w = p => { off(name, w); fn(p); }; return on(name, w); }
  function emit(name, payload) { const l = subs[name]; if (!l || !l.length) return; for (const fn of l.slice()) { try { fn(payload); } catch (e) { bad(name, e); } } }
  return { on, off, once, emit, count: name => (subs[name] || []).length };
})();

const HOOKS = (() => {
  const pts = Object.create(null), warned = Object.create(null);
  let seq = 0;
  const bad = (name, e) => { if (warned[name]) return; warned[name] = 1; try { console.error('HOOK "' + name + '" threw: ' + (e && e.stack || e)); } catch (x) { /* no console */ } };
  function add(name, fn, order = 0) {
    const l = pts[name] || (pts[name] = []); l.push({ fn, order, n: seq++ }); l.sort((a, b) => a.order - b.order || a.n - b.n);
    return () => remove(name, fn);
  }
  function remove(name, fn) { const l = pts[name]; if (!l) return; const i = l.findIndex(h => h.fn === fn); if (i >= 0) l.splice(i, 1); }
  function run(name, ...args) {
    const l = pts[name]; if (!l || !l.length) return;
    for (const h of l.slice()) { try { h.fn(...args); } catch (e) { bad(name, e); } }
  }
  function filter(name, value, ...args) {
    const l = pts[name]; if (!l || !l.length) return value;
    for (const h of l.slice()) { try { const r = h.fn(value, ...args); if (r !== undefined) value = r; } catch (e) { bad(name, e); } }
    return value;
  }
  function collect(name, ...args) {
    const out = [], l = pts[name]; if (!l || !l.length) return out;
    for (const h of l.slice()) { try { const r = h.fn(...args); if (Array.isArray(r)) out.push(...r); else if (r != null) out.push(r); } catch (e) { bad(name, e); } }
    return out;
  }
  return { add, remove, run, filter, collect, has: name => !!(pts[name] && pts[name].length) };
})();

</script>
<script>
// ---- settings.js ----
// ===== AGENT BRAWL extension layer, part 2: SETTINGS. One persisted store for every option. Loaded after bus.js. =====
// Owner: scaffold (core keys); options.js owns the screen that edits them. Stored as JSON under localStorage 'brawl.settings'; storage that is blocked or corrupt just means the defaults.
//   SETTINGS.define(key, spec)  register a key: spec = { def, type?, min?, max?, step?, values?, label?, legacy?, fromLegacy? }
//                               type is inferred: boolean -> 'bool', number -> 'num' (clamped to min..max, rounded to step), values array -> 'enum', anything else -> 'any' (JSON-safe value)
//                               legacy / fromLegacy: an older localStorage key to read once when nothing is stored yet (fromLegacy turns its string into the value)
//   SETTINGS.get(key)           current value (the default when unset or invalid; undefined for an unknown key)
//   SETTINGS.set(key, value)    validate, store, persist, emit BUS 'settings' { key, value, old } when it changed; returns the stored value
//   SETTINGS.toggle(key)        flip a bool key
//   SETTINGS.reset(key)         back to the default (no key: reset all)
//   SETTINGS.all()              { key: value } for every defined key
//   SETTINGS.list()             definitions in registration order, for an options screen
// Feature files add their own keys with SETTINGS.define at load time. Do not read localStorage for options anywhere else.
'use strict';
const SETTINGS = (() => {
  const KEY = 'brawl.settings', defs = Object.create(null);
  let store = {};
  try { const raw = localStorage.getItem(KEY), o = raw && JSON.parse(raw); if (o && typeof o === 'object' && !Array.isArray(o)) store = o; } catch (e) { store = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* storage blocked: the value lives for this visit only */ } };
  // strict: a value read back from storage must already have the right type; otherwise (set) it is converted when it can be
  function norm(d, v, strict) {
    switch (d.type) {
      case 'bool': return strict ? (typeof v === 'boolean' ? v : d.def) : !!v;
      case 'num': {
        if (!strict) v = Number(v); if (typeof v !== 'number' || !isFinite(v)) return d.def;
        if (d.step) v = Math.round(v / d.step) * d.step;
        return +Math.min(d.max, Math.max(d.min, v)).toFixed(6);
      }
      case 'enum': return d.values.includes(v) ? v : d.def;
      default: return v === undefined ? d.def : v;
    }
  }
  function get(key) { const d = defs[key]; if (!d) return undefined; return key in store ? norm(d, store[key], true) : d.def; }
  function define(key, spec) {
    const def = spec.def, d = Object.assign({ key, label: key.toUpperCase(), min: -Infinity, max: Infinity, type: spec.values ? 'enum' : typeof def === 'boolean' ? 'bool' : typeof def === 'number' ? 'num' : 'any' }, spec);
    defs[key] = d;
    if (!(key in store) && d.legacy) { try { const raw = localStorage.getItem(d.legacy); if (raw !== null) store[key] = d.fromLegacy ? d.fromLegacy(raw) : raw; } catch (e) { /* blocked: default */ } }
    return get(key);
  }
  function set(key, v) {
    const d = defs[key]; if (!d) return undefined;
    const old = get(key); v = norm(d, v, false); store[key] = v; save();
    if (v !== old) BUS.emit('settings', { key, value: v, old });
    return v;
  }
  function reset(key) {
    const keys = key ? [key] : Object.keys(defs);
    for (const k of keys) { if (!(k in defs)) continue; const old = get(k); delete store[k]; if (old !== defs[k].def) BUS.emit('settings', { key: k, value: defs[k].def, old }); }
    save();
  }
  const api = {
    define, get, set, reset, toggle: key => set(key, !get(key)),
    all() { const o = {}; for (const k in defs) o[k] = get(k); return o; },
    list() { return Object.keys(defs).map(k => Object.assign({}, defs[k])); },
  };
  return api;
})();

// ---- core keys (the engine reads these) ----
SETTINGS.define('difficulty', { def: 'normal', values: ['easy', 'normal', 'hard'], label: 'DIFFICULTY' });         // CPU level at the start of a match and how fast it ramps (game.js DIFFICULTY)
SETTINGS.define('rounds', { def: 2, min: 1, max: 4, step: 1, label: 'ROUNDS TO WIN' });                            // rounds a fighter must win; sudden death is round 2 * rounds
SETTINGS.define('time', { def: 99, min: 30, max: 99, step: 1, label: 'ROUND TIME' });                              // seconds per round (sudden death stays 30)
SETTINGS.define('musicVol', { def: 1, min: 0, max: 1, step: 0.05, label: 'MUSIC' });                              // 1 = the mix the tests measure; applied in music.js
SETTINGS.define('sfxVol', { def: 1, min: 0, max: 1, step: 0.05, label: 'EFFECTS' });                              // beep() and thud() in game.js
SETTINGS.define('voiceVol', { def: 1, min: 0, max: 1, step: 0.05, label: 'ANNOUNCER' });                          // speech and stingers in hud.js
SETTINGS.define('gore', { def: true, label: 'BLOOD', legacy: 'brawl.gore', fromLegacy: v => v !== '0' });          // FX.gore (hud.js) mirrors it
SETTINGS.define('muted', { def: false, label: 'MUTE', legacy: 'brawl.muted', fromLegacy: v => v === '1' });        // game.js keeps its top-level `muted` in step
SETTINGS.define('binds', { def: null, label: 'KEY BINDINGS' });                                                    // null = defaults; or { p1?, p2?, alt? }: action letter -> array of KeyboardEvent.code (game.js applyBinds)

</script>
<script>
// ---- modes.js ----
// ===== AGENT BRAWL extension layer, part 3: MODES. The registry behind the title menu. Loaded after settings.js. =====
// Owner: scaffold (registry and the two built-in modes); arcade.js and training.js register more.
//   MODES.register(def)   add (or replace, same id) a mode. def: { id, label, order?, players?, onPick?, onMatchStart?, onRoundStart?, onRoundEnd?, onMatchEnd? }
//       id       unique string, also stored in game.modeId while the mode is played
//       label    the title menu text (capitals)
//       order    menu position, lower first (built-ins: versus 10, versus2 20; default 100)
//       players  1 = P1 against the CPU, 2 = two humans; becomes game.mode (the engine and the tests still read game.mode)
//       onPick(game)             the title entry was chosen, before the select screen; return false to skip the select screen (the mode took over)
//       onMatchStart(info)       the callbacks below run for the current mode only (game.modeId), from the BUS events of the same names
//       onRoundStart(info) onRoundEnd(info) onMatchEnd(info)   info is the BUS payload (docs/ARCHITECTURE.md)
//   MODES.get(id), MODES.list() (sorted by order), MODES.current() (the mode of game.modeId), MODES.pick(id) (set game.modeId and game.mode, returns the mode)
// The title menu is MODES.list() plus whatever HOOKS 'titleItems' collects, so a feature that is a place to go (options) is an item and one that is a way to fight is a mode.
'use strict';
const MODES = (() => {
  const reg = []; let seq = 0;
  function register(def) {
    if (!def || typeof def.id !== 'string') throw new Error('MODES.register needs an id');
    const m = Object.assign({ label: def.id.toUpperCase(), order: 100, players: 1 }, def, { seq: seq++ });
    const i = reg.findIndex(x => x.id === m.id); if (i >= 0) reg.splice(i, 1);
    reg.push(m); reg.sort((a, b) => a.order - b.order || a.seq - b.seq);
    return m;
  }
  const get = id => reg.find(m => m.id === id) || null;
  const current = () => get(typeof game !== 'undefined' ? game.modeId : 'versus');
  function pick(id) {
    const m = get(id); if (!m) return null;
    game.modeId = m.id; game.mode = m.players === 2 ? 2 : 1;
    return m;
  }
  for (const [ev, cb] of [['match:start', 'onMatchStart'], ['round:start', 'onRoundStart'], ['round:end', 'onRoundEnd'], ['match:end', 'onMatchEnd']])
    BUS.on(ev, info => { const m = current(); if (m && typeof m[cb] === 'function') m[cb](info); });
  return { register, get, list: () => reg.slice(), current, pick };
})();

MODES.register({ id: 'versus', label: '1 PLAYER VS CPU', order: 10, players: 1 });
MODES.register({ id: 'versus2', label: '2 PLAYERS', order: 20, players: 2 });

</script>

    [['YES', -80, 0], ['NO', 80, 1]].forEach(([s, dx, k]) => { const on = ui.qsel === k; if (on) { ctx.fillStyle = 'rgba(255,215,106,0.25)'; ctx.fillRect(W / 2 + dx - 60, 270, 120, 44); } uiText(s, W / 2 + dx, 292, 24, on ? GOLD : STEEL); });
  }
  function drawScreen() {
    const s = ui.screen;
    if (!s) drawPauseMenu(); else if (s === 'options') drawOptions(); else if (s === 'controls') drawControls(); else if (s === 'moves') drawMoves(); else if (s === 'quit') { drawPauseMenu(); drawQuit(); }
  }
  function drawFsButton() {

    uiText(fsEl() ? 'EXIT FULLSCREEN' : 'F  FULLSCREEN', FSB.x + FSB.w / 2, FSB.y + FSB.h / 2 + 1, 15, '#c9c3b8');
  }

  // ---------- wrapping the engine's draw calls (they resolve through the global object, so reassigning window.name is enough) ----------
  const uiText0 = window.uiText;
  window.uiText = function (s, x, y, size, col, align, alpha) {

  };

  window.drawPost = function (c, t, opts) {

    if (SETTINGS.get('crt') && !opts.scan) opts.scan = 1.5;
    return drawPost0.call(this, c, t, opts);
  };
  const drawHUD0 = window.drawHUD;
  window.drawHUD = function (c, g) {
    if (g && SETTINGS.get('infTime') && typeof g.timer === 'number') { const t = g.timer; g.timer = '--'; try { return drawHUD0.apply(this, arguments); } finally { g.timer = t; } }
    return drawHUD0.apply(this, arguments);
  };
  const drawFight0 = window.drawFight;
  window.drawFight = function () {
    if (game.phase !== 'pause') return drawFight0.apply(this, arguments);
    game._phase = 'fight';   // the world, HUD and banner are drawn as in a fight; the stock pause overlay (which needs phase 'pause') is replaced by the menu below
    try { drawFight0.apply(this, arguments); } finally { game._phase = 'pause'; }
    drawScreen();
  };
  const drawTitle0 = window.drawTitle;
  window.drawTitle = function () { drawTitle0.apply(this, arguments); if (ui.screen) drawScreen(); else drawFsButton(); };
  const drawTouch0 = window.drawTouch;
  window.drawTouch = function () { if (!drawTouch0 || ui.screen || game.phase === 'pause') return; return drawTouch0.apply(this, arguments); };   // the on-screen buttons would sit on top of the menus
  if (window.ANNOUNCER && ANNOUNCER.say) { const say0 = ANNOUNCER.say; ANNOUNCER.say = function () { if (!SETTINGS.get('announcer')) return; return say0.apply(this, arguments); }; }

  window.OPTIONS = {
    get screen() { return ui.screen; }, get capturing() { return !!ui.capture; }, get message() { return ui.msg; }, get warning() { return ui.bad && game.tick - ui.msgT < 220; },
    open(s) { ui.stack = game.phase === 'pause' ? [null] : []; ui.screen = s || 'options'; ui.capture = null; ui.osel = 0; },
    close() { ui.screen = null; ui.stack = []; ui.capture = null; },
    rows: () => getRows().map(r => r.label), state: ui,

<script>

<script>
// ---- defense.js ----
// ===== AGENT BRAWL feature file: DEFENSE (second batch, x-defense). Loaded after touch.js (see docs/ARCHITECTURE.md and docs/features/x-defense.md). =====
// Owner: the x-defense agent. Only that agent edits this file, tools/tests/x-defense.mjs and docs/features/x-defense.md.
// Area: defensive options that make it feel like a real fighter. Perfect guard (tap back as a hit lands), a short blockstun, guard pushback,
// quick rise, tech roll and stay-down when knocked down, air recovery and a wake-up reversal.
// Hooks used:
//   HOOKS 'update' (tick clock, effect timers), 'input' (back-press edge, blockstun lock, pushback, knockdown options, air recovery, wake-up reversal, CPU choices),
//   'damage' (perfect guard: no chip, a 4 tick stun), 'fighterUpdate' (roll bookkeeping), 'drawFighter' (the roll sprite), 'drawWorld' (rings, texts),
//   'drawHud' (round 1 hint strip), 'drawTop' (blue flash, pause panel).
//   BUS 'block' 'hit' 'match:start' 'round:start' (listens), 'defense:perfect' 'defense:pushback' 'defense:rise' 'defense:roll' 'defense:air' 'defense:reversal' (emits).
//   SETTINGS 'difficulty' is read for the CPU. No other file is edited; there is no setting of its own: DEFENSE.on = false switches the whole feature off.
// Integration notes (combat.js brings a three-bar meter, its own blockstun and hard knockdowns): DEFENSE.meter() finds the meter size and bars, DEFENSE.ownBlockstun = false
// hands the blockstun to combat.js, and a fighter with f.noTech = true cannot rise or roll. The 'damage' payload stun is lowered to 4 on a perfect guard for combat.js to read.
'use strict';
(() => {
  const WIN = 4, LOCK = 10, PG_STUN = 4, PG_METER = 0.06;           // perfect guard: ticks before the hit, anti-mash lockout between presses, blockstun, meter reward (share of the bar)
  const RISE_WIN = 10, STAY_EXTRA = 20, ROLL_LEN = 14, PUSH_INV = 12, PUSH_LOCK = 8, PUSH_RANGE = 240;
  const AIR_AFTER = 30, WAKE_INV = 6, PRE = 3;                              // air recovery: juggle ticks before the escape opens; wake-up reversal: invulnerable ticks
  const mk = () => ({ pre: -99, bk: false, edgeN: -99, edgeOk: false, bstun: 0, inDown: false, used: false, stay: false, plan: null, rollT: 0, rollDir: 0, air: 0, airDone: false, wasDown: false });
  const REC = [mk(), mk()];
  const S = { n: 0, fx: [], flash: 0, pg: null, stun: 0 };
  const COUNT = { perfect: 0, push: 0, rise: 0, roll: 0, stay: 0, air: 0, reversal: 0 };

  // meter size, number of bars and the price of one pushback; combat.js (three bars) is found when it exposes COMBAT, otherwise the bar is the plain 100 and the price is half of it
  function meterInfo() {
    const C = (typeof COMBAT !== 'undefined' && COMBAT) || window.COMBAT || {};
    const max = Number(C.meterMax || C.METER_MAX || (typeof METER_MAX !== 'undefined' && METER_MAX)) || 100;
    const bars = Number(C.bars || C.BARS || C.meterBars || (typeof METER_BARS !== 'undefined' && METER_BARS)) || 1;
    return { max, bars, cost: bars > 1 ? max / bars : max / 2 };
  }
  const D = window.DEFENSE = { on: true, ownBlockstun: true, rec: REC, state: S, count: COUNT, meter: meterInfo, WIN, RISE_WIN, STAY_EXTRA, PG_STUN, reset: () => reset(), rates: () => ({ pg: pgRate(), rise: riseRate() }) };

  const diff = () => { try { return SETTINGS.get('difficulty'); } catch (e) { return 'normal'; } };
  const pgRate = () => ({ easy: 0.06, normal: 0.16, hard: 0.3 }[diff()] ?? 0.16) * (0.7 + 0.6 * (game.cpuLevel || 0.5));   // CPU perfect guard chance per blocked hit
  const riseRate = () => ({ easy: 0.12, normal: 0.3, hard: 0.55 }[diff()] ?? 0.3);                                       // CPU quick rise chance per knockdown
  const strip = i => { i.p = i.k = i.s = i.x = i.u = false; i.dash = 0; };
  const say = (f, txt, col = '#9fd3ff') => S.fx.push({ k: 'txt', x: f.x, y: f.y - 215, t: 0, life: 34, txt, col });
  const ring = (x, y, col, r0, dr, life = 16) => S.fx.push({ k: 'ring', x, y, t: 0, life, col, r0, dr });
  const bstunFor = (stun, kind) => kind === 'super' ? 16 : Math.max(6, Math.min(14, Math.round((stun || 14) * 0.55)));   // the engine has no blockstun: a share of the hit's own stun

  function perfect(v, src, kind) {
    const r = REC[v.side], mi = D.meter();
    r.bstun = PG_STUN; v.meter = Math.min(mi.max, v.meter + mi.max * PG_METER);
    game.hitstop = Math.max(game.hitstop, 9); S.flash = 12;
    if (src) src.vx = (src.x < v.x ? -1 : 1) * 4;
    const x = v.x + v.face * 30, y = v.y - 100;
    FX.sparks(x, y, '#7ec8ff', 14); ring(x, y, '#9fd3ff', 8, 5, 18); ring(x, y, '#ffffff', 4, 9, 12); say(v, 'PERFECT GUARD', '#9fd3ff');
    beep(1320, 0.07, 'sine', 0.07, 1); game.later(4, () => beep(1760, 0.14, 'sine', 0.06, 1));
    COUNT.perfect++; BUS.emit('defense:perfect', { victim: v, src, kind });
  }

  // ---- 'damage': a guarded hit whose victim pressed back in the last WIN ticks (human) or won the CPU roll becomes a perfect guard ----
  HOOKS.add('damage', pl => {
    if (!D.on || !pl || !pl.guarding || !pl.victim) return;
    const v = pl.victim, r = REC[v.side];
    S.stun = pl.stun;
    const pg = v.cpu ? Math.random() < pgRate() : r.bk && r.edgeOk && S.n - r.edgeN <= WIN && v.onGround;
    if (!pg) return;
    pl.dmg = 0; pl.kb = Math.min(pl.kb, 1); pl.stun = Math.min(pl.stun, PG_STUN);   // no chip, no pushback, the stun a combat blockstun would read
    S.pg = { victim: v, n: S.n };
  }, 50);

  BUS.on('block', e => {
    if (!D.on || !e || !e.victim) return;
    const v = e.victim, r = REC[v.side];
    if (S.pg && S.pg.victim === v && S.pg.n === S.n) { S.pg = null; perfect(v, e.src, e.kind); return; }
    if (D.ownBlockstun) r.bstun = Math.max(r.bstun, bstunFor(S.stun, e.kind));
  });
  BUS.on('hit', e => { const r = e && e.victim && REC[e.victim.side]; if (r) r.bstun = 0; });
  const reset = () => { (game.f || []).forEach((f, s) => { if (REC[s] && REC[s].rollT > 0) f.hidden = false; }); for (const s of [0, 1]) Object.assign(REC[s], mk()); S.fx.length = 0; S.flash = 0; S.pg = null; };
  BUS.on('match:start', reset); BUS.on('round:start', reset);

  // ---- guard pushback: L during blockstun spends a bar (half the plain meter) and shoves the attacker away; the defender is untouchable for a few ticks ----
  function pushback(f, side, r) {
    const o = game.f[1 - side], cost = D.meter().cost;
    if (f.meter < cost - 1e-6) { beep(110, 0.07, 'square', 0.05); say(f, 'NEED METER', '#ff9c8a'); return; }
    if (!o || o.state === 'ko' || o.hidden || Math.abs(o.x - f.x) > PUSH_RANGE) { beep(110, 0.07, 'square', 0.05); say(f, 'TOO FAR', '#ff9c8a'); return; }
    f.meter = Math.max(0, f.meter - cost);
    const away = o.x >= f.x ? 1 : -1;
    o.set('hurt'); o.stun = 16; o.vx = away * 12; o.vy = o.onGround ? 0 : Math.min(o.vy, -2); o.airSp = false; o.bufP = o.bufK = o.bufS = 0;
    f.inv = Math.max(f.inv, PUSH_INV); r.bstun = PUSH_LOCK;
    game.hitstop = Math.max(game.hitstop, 6); game.shake = Math.max(game.shake, 6);
    FX.sparks(f.x + f.face * 30, f.y - 100, '#7ec8ff', 14); ring(f.x, f.y - 90, '#ffffff', 20, 9, 18); say(f, 'PUSHBACK', '#ffffff');
    beep(300, 0.12, 'square', 0.06, 2); thud(0.12, 0.1);
    COUNT.push++; BUS.emit('defense:pushback', { victim: f, src: o, cost });
  }

  // ---- knocked down: P or K in the first RISE_WIN ticks on the floor rises early, a direction rolls, down held at the end stays down STAY_EXTRA ticks longer ----
  function quickRise(f) {
    f.lie = Math.max(f.lie, DOWN_LIE - 8); f.st = Math.max(f.st, 36);   // the last 8 ticks of the engine's own get-up animation, then its usual 14 invulnerable ticks
    COUNT.rise++; say(f, 'QUICK RISE'); beep(520, 0.05, 'triangle', 0.04); FX.dust(f.x, GROUND); BUS.emit('defense:rise', { fighter: f });
  }
  function startRoll(f, r, dir) {
    f.set('dash'); f.dashBack = dir !== f.face; f.dashV = dir * f.d.spd * 2.7; f.dashCool = 22; f.inv = Math.max(f.inv, ROLL_LEN + 4); f.hidden = true;   // hidden: untargetable and slips through the foe
    r.rollT = ROLL_LEN; r.rollDir = dir; COUNT.roll++; say(f, 'ROLL'); beep(200, 0.07, 'triangle', 0.05); FX.dust(f.x, GROUND); BUS.emit('defense:roll', { fighter: f, dir });
  }
  const cpuPlan = () => { const go = Math.random() < riseRate(); return { go, at: 2 + Math.floor(Math.random() * 5), roll: go && Math.random() < 0.35 ? (Math.random() < 0.5 ? 1 : -1) : 0 }; };
  function downOptions(i, f, r, fw, bw) {
    if (!r.inDown) { r.inDown = true; r.used = false; r.stay = false; r.plan = null; r.air = 0; r.airDone = false; r.pre = -99; }
    if (!f.onGround || f.vy < 0 || f.noTech) { if (i.p || i.k) r.pre = S.n; return; }   // still being tossed does not count as lying down; a press in the last PRE ticks of the fall is kept
    const L = f.lie, early = S.n - r.pre <= PRE;
    if (f.cpu) {   // the CPU's own random presses are ignored while it lies there; it follows one plan per knockdown
      i.p = i.k = false; i[fw] = i[bw] = false; if (!r.plan) r.plan = cpuPlan();
      if (r.plan.go && L === r.plan.at) { i.p = true; if (r.plan.roll) i[r.plan.roll > 0 ? fw : bw] = true; }
    }
    if (!r.used && L < RISE_WIN && (i.p || i.k || early)) {
      r.used = true;
      const goF = i[fw] && !i[bw], goB = i[bw] && !i[fw];
      i.p = i.k = false; f.bufP = f.bufK = 0;
      if (goF || goB) startRoll(f, r, goF ? f.face : -f.face); else quickRise(f);
      return;
    }
    if (!r.stay && !r.used && i.d && L >= DOWN_LIE - 1) { r.stay = true; f.lie = DOWN_LIE - 1 - STAY_EXTRA; COUNT.stay++; say(f, 'STAY DOWN'); }
  }

  // ---- air recovery: reeling in the air for more than AIR_AFTER ticks, any button flips the victim out once per combo ----
  function airRecovery(i, f, r) {
    const air = (f.state === 'hurt' || f.state === 'hit') && !f.onGround;
    if (!air) { r.air = 0; if (f.state === 'idle' || f.state === 'walk' || f.state === 'block') r.airDone = false; return; }   // back on the floor in a neutral state: the next combo gets its own escape
    r.air++;
    if (f.cpu || r.airDone || r.air <= AIR_AFTER || !(i.p || i.k || i.s)) return;
    r.airDone = true; i.p = i.k = i.s = false; f.bufP = f.bufK = f.bufS = 0;
    const o = game.f[1 - f.side], dir = o && o.x > f.x ? -1 : 1;
    f.set('jump'); f.vy = -7; f.vx = dir * 4.5; f.inv = Math.max(f.inv, 12); f.land = 0;
    COUNT.air++; say(f, 'AIR RECOVERY'); FX.sparks(f.x, f.y - 90, '#9fd3ff', 10); beep(640, 0.08, 'triangle', 0.05, 1.6); BUS.emit('defense:air', { fighter: f });
  }

  // ---- wake-up reversal: a special pressed (or buffered) on the very first free tick after standing up carries WAKE_INV invulnerable ticks ----
  function wakeUp(i, f, r) {
    const first = r.wasDown && f.state === 'idle';
    r.wasDown = f.state === 'down';
    if (!first || f.cpu || f.cool > 0 || !(i.s || f.bufS > 0)) return;
    f.inv += WAKE_INV; COUNT.reversal++; say(f, 'REVERSAL', '#ffd76a'); BUS.emit('defense:reversal', { fighter: f });
  }

  function onInput(i, side, f) {
    if (!D.on || !i || !f || game.phase !== 'fight') return;
    const r = REC[side], fw = f.face > 0 ? 'r' : 'l', bw = f.face > 0 ? 'l' : 'r';
    const bk = !!(i[bw] && !i[fw]);
    if (bk && !r.bk) { r.edgeOk = S.n - r.edgeN >= LOCK; r.edgeN = S.n; }   // a fresh press of back opens the perfect guard window unless the last press was under LOCK ticks ago
    r.bk = bk;
    if (f.state === 'down') downOptions(i, f, r, fw, bw); else r.inDown = false;
    airRecovery(i, f, r); wakeUp(i, f, r);
    if (r.rollT > 0) { strip(i); return i; }
    if (r.bstun > 0) {
      if (f.state !== 'block') r.bstun = 0;
      else {
        if (i.s && !f.cpu) pushback(f, side, r);
        r.bstun--; strip(i); i[bw] = true; i[fw] = false;   // locked in the guard for the rest of the blockstun
        f.bufP = f.bufK = f.bufS = 0;
      }
    }
    return i;
  }
  HOOKS.add('input', onInput, 50);

  HOOKS.add('update', g => {
    if (!D.on || g.phase === 'pause') return;
    if (g.phase !== 'fight') for (const f of g.f || []) { const r = REC[f.side]; if (r && r.rollT > 0) { r.rollT = 0; f.hidden = false; } }   // a roll never outlives the fight (KO, finisher, outro): nobody stays invisible
    if (g.hitstop <= 0) S.n++;
    for (const e of S.fx) e.t++;
    S.fx = S.fx.filter(e => e.t < e.life);
    if (S.flash > 0) S.flash--;
  });
  HOOKS.add('fighterUpdate', (a, b) => {
    for (const f of [a, b]) { const r = REC[f.side]; if (r && r.rollT > 0) { r.rollT--; if (r.rollT <= 0 || f.state !== 'dash') { r.rollT = 0; f.hidden = false; } } }
  });

  // ---- art: the roll is the fighter tucked and spinning with two ghosts behind it ----
  HOOKS.add('drawFighter', (c, f) => {
    const r = REC[f.side]; if (!D.on || !r || r.rollT <= 0 || !f.hidden) return;
    const k = ROLL_LEN - r.rollT, dir = r.rollDir, cy = f.y - 50;
    c.save(); c.fillStyle = 'rgba(0,0,0,0.45)'; c.beginPath(); c.ellipse(f.x, GROUND + 2, 40, 7, 0, 0, 7); c.fill(); c.restore();
    for (let g = 2; g >= 0; g--) {
      const xg = f.x - dir * g * 16;
      c.save(); c.globalAlpha = g ? 0.2 : 1; c.translate(xg, cy); c.rotate(dir * (k * 0.55 - g * 0.5)); c.translate(-xg, -cy);
      drawSprite(c, f.d.id, 'jump', 2, Math.round(xg), Math.round(f.y), f.face); c.restore();
    }
  });
  HOOKS.add('drawWorld', c => {
    if (!D.on) return;
    for (const e of S.fx) {
      const p = e.t / e.life;
      if (e.k === 'ring') { c.save(); c.globalAlpha = 1 - p; c.strokeStyle = e.col; c.lineWidth = 4 - 2 * p; c.beginPath(); c.arc(e.x, e.y, e.r0 + e.t * e.dr, 0, 7); c.stroke(); c.restore(); }
      else uiText(e.txt, e.x, e.y - e.t * 1.2, 16, e.col, 'center', 1 - p * p);
    }
  });
  HOOKS.add('drawHud', (c, g) => {   // the two new lines sit above the engine's own round 1 hint strip and fade with it
    if (!D.on || g.phase !== 'fight' || g.round !== 1 || g.clock >= 360 || (typeof touch !== 'undefined' && touch.on) || (g.f[0].cpu && g.f[1].cpu)) return;
    const a = Math.min(1, (360 - g.clock) / 60);
    uiText('PERFECT GUARD: TAP BACK JUST AS A HIT LANDS · BLOCKING + L: PUSHBACK, COSTS METER', W / 2, H - 96, 13, '#9fd3ff', 'center', a);
    uiText('KNOCKED DOWN: P OR K GETS UP FAST · ADD A DIRECTION TO ROLL · HOLD DOWN TO STAY DOWN', W / 2, H - 76, 13, '#9fd3ff', 'center', a);
  });
  HOOKS.add('drawTop', (c, g) => {
    if (!D.on) return;
    if (S.flash > 0 && g.phase !== 'pause') { c.fillStyle = 'rgba(110,180,255,' + (0.32 * S.flash / 12).toFixed(3) + ')'; c.fillRect(0, 0, W, H); }
    if (g.phase === 'pause' && !(typeof OPTIONS !== 'undefined' && OPTIONS.screen)) {   // the options sub-screens (MOVES, CONTROLS...) use the bottom rows
      uiText('DEFENSE · TAP BACK AS A HIT LANDS: PERFECT GUARD · WHILE BLOCKING, SPECIAL: PUSHBACK (COSTS METER)', W / 2, 496, 13, '#9fd3ff');
      uiText('KNOCKED DOWN · PUNCH OR KICK: QUICK RISE · WITH A DIRECTION: ROLL · HOLD DOWN: STAY DOWN LONGER', W / 2, 514, 13, '#9fd3ff');
    }
  });
})();

</script>
<script>
// ---- cpu2.js ----
// ===== AGENT BRAWL feature file: CPU2. Smarter CPU opponents. Loaded after touch.js (see docs/ARCHITECTURE.md). =====
// Owner: the x-cpu2 agent. Only that agent edits this file, tools/tests/x-cpu2.mjs and docs/features/x-cpu2.md.
// Area: the CPU fighter's brain. A personality per fighter (aggression, spacing, favourite specials, jump-in / block / throw / taunt rates),
//   adaptation to the habits of the foe within a match (jump-ins, blocking, lows, throws, special spam, whiffs), and a skill curve (reaction delay,
//   mistake rate, tech, anti-air, punish) driven by SETTINGS 'difficulty', which gains a fourth value, NIGHTMARE.
// Hooks used: input (replaces the input of a CPU fighter in the fight phase, never a human's; other hooks still see the result), fighterUpdate (watches both fighters),
//   drawHud (CPU vs CPU: both personalities), drawTop (the CPU level on the VS screen in 1P). BUS: match:start, round:start, hit, throw, special, super.

    if (softFlash()) { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = 'rgba(255,214,120,0.16)'; ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height); ctx.restore(); return; }
    const m = ctx.getTransform(), cw = ctx.canvas.width, ch = ctx.canvas.height;
    if (!silCv || silCv.width !== cw || silCv.height !== ch) { silCv = document.createElement('canvas'); silCv.width = cw; silCv.height = ch; }
    const o = silCv.getContext('2d'); o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.clearRect(0, 0, cw, ch);
    o.setTransform(m);
    for (const f of g.f) { if (f.hidden) continue; const [anim, fr] = f.frame(); drawSprite(o, f.d.id, anim, fr, Math.round(f.x), Math.round(f.y), f.face); }
    o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-in'; o.fillStyle = '#0b0b14'; o.fillRect(0, 0, cw, ch); o.globalCompositeOperation = 'source-over';
    const bg = im.tier === 'super' ? '#ffe45a' : im.counter ? '#ff6a5a' : '#f6f6ee', sx = m.a * im.x + m.c * im.y + m.e, sy = m.b * im.x + m.d * im.y + m.f;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#0b0b14';
    for (let i = 0; i < 16; i++) {   // radial speed lines aimed at the impact point
      const an = i * Math.PI / 8 + (im.t ? 0.1 : 0), w = 0.045, r0 = 70 + (i % 3) * 18, r1 = 900;
      ctx.beginPath(); ctx.moveTo(sx + Math.cos(an - w) * r0, sy + Math.sin(an - w) * r0); ctx.lineTo(sx + Math.cos(an) * r1, sy + Math.sin(an) * r1); ctx.lineTo(sx + Math.cos(an + w) * r0, sy + Math.sin(an + w) * r0); ctx.closePath(); ctx.fill();
    }
    ctx.drawImage(silCv, 0, 0); ctx.restore();
  }

  function drawReplayWorld(ctx) {
    const e = R.cur; if (!e) return;
    for (const it of e.fx) { try { if (it.o.draw) { const v = Object.create(it.o); Object.assign(v, it.s); it.o.draw.call(v, ctx, v); } } catch (err) { /* a recorded effect that cannot be redrawn is skipped */ } }
    for (const it of e.proj) { try { const v = Object.create(it.o); Object.assign(v, it.s); drawProj(v); } catch (err) { /* same */ } }
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    const bar = Math.round(40 * ease(R.t / 8) * (R.i > R.ring.length + HOLD - 8 ? clamp((R.ring.length + HOLD - R.i) / 8, 0, 1) : 1));
    ctx.fillStyle = 'rgba(30,50,110,0.14)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
    ctx.restore();
  }
  HOOKS.add('drawWorld', (ctx, g) => {
    if (g.phase === 'pause') return;
    if (R.on) drawReplayWorld(ctx);
    drawImpact(ctx, g);
    for (const s of S.sparks) drawSpark(ctx, s);
  });

  HOOKS.add('drawHud', (ctx, g) => {   // the engine draws its own banner right after this hook: a cut-in or a replay owns the screen instead
    if ((S.cut || R.on) && g.banner) { S.stash = g.banner; g.banner = null; }
  });

  const bandY = x => 307 - 60 * (x + 80) / (W + 160);
  function drawCut(ctx) {
    const c = S.cut; if (!c) return;
    const t = c.t, len = c.len, inP = ease(t / 6), outP = t > len - 6 ? ease((t - (len - 6)) / 6) : 0, right = c.f.side === 1;
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,' + (0.5 * Math.min(1, t / 4) * (1 - outP)) + ')'; ctx.fillRect(0, 0, W, H);
    ctx.translate(-(1 - inP) * W + outP * W, 0);
    const path = (dy) => { ctx.beginPath(); ctx.moveTo(-80, 232 + dy); ctx.lineTo(W + 80, 172 + dy); ctx.lineTo(W + 80, 322 + dy); ctx.lineTo(-80, 382 + dy); ctx.closePath(); };
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; path(12); ctx.fill();
    ctx.fillStyle = c.col; path(0); ctx.fill();
    ctx.save(); path(0); ctx.clip();
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.moveTo(-80, 330); ctx.lineTo(W + 80, 270); ctx.lineTo(W + 80, 330); ctx.lineTo(-80, 390); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 3;   // speed lines, all parallel to the band
    for (let i = 0; i < 22; i++) {
      const sp = 26 + (i * 13) % 31, len2 = 90 + (i * 53) % 170, x0 = ((i * 211 + t * sp) % (W + 400)) - 200, y0 = 190 + (i * 47) % 190;
      ctx.strokeStyle = i % 3 ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.moveTo(x0, y0 - x0 * 0.053); ctx.lineTo(x0 + len2, y0 - (x0 + len2) * 0.053); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-80, 232); ctx.lineTo(W + 80, 172); ctx.moveTo(-80, 382); ctx.lineTo(W + 80, 322); ctx.stroke();
    const pw = 200, ph = 250, pxx = right ? W - 40 - pw : 40, pyy = Math.round(bandY(pxx + pw / 2) - ph / 2 - 20);
    ctx.fillStyle = '#0b0b14'; ctx.fillRect(pxx - 5, pyy - 5, pw + 10, ph + 10);
    try { drawPortrait(ctx, c.f.d.id, pxx, pyy, pw, ph, right); } catch (e) { /* portrait is optional */ }
    const name = c.name.toUpperCase(); let sz = 6; while (sz > 3 && ptextWidth(name, sz) > 600) sz--;
    const tx = right ? pxx - 28 : pxx + pw + 28, ty = Math.round(bandY(tx + (right ? -ptextWidth(name, sz) / 2 : ptextWidth(name, sz) / 2)) - sz * 3.5 + 6);
    ptext(ctx, c.label, tx, ty - 30, 3, '#fff', right ? 'right' : 'left');
    ptext(ctx, name, tx, ty, sz, '#fff', right ? 'right' : 'left');
    const who = typeof SHORT === 'function' ? SHORT(c.f.d) : String(c.f.d.id).toUpperCase();
    ptext(ctx, who, tx, ty + sz * 7 + 10, 2, 'rgba(0,0,0,0.75)', right ? 'right' : 'left', false);
    ctx.restore();
    if (t < 3) {   // the white pop of the first frames; a soft tint when flashing is reduced
      ctx.save(); ctx.fillStyle = softFlash() ? 'rgba(255,214,120,' + (0.16 * (1 - t / 3)) + ')' : 'rgba(255,255,255,' + (0.75 * (1 - t / 3)) + ')'; ctx.fillRect(0, 0, W, H); ctx.restore();
    }
  }
  function drawReplayTop(ctx) {
    if (!R.on) return;
    const bar = 40, blink = Math.floor(R.t / 24) % 2 === 0;
    if (R.t < 10) { ctx.save(); ctx.fillStyle = 'rgba(255,255,255,' + (softFlash() ? 0.08 : 0.4 * (1 - R.t / 10)) + ')'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
    if (blink) { ctx.fillStyle = '#ff3b3b'; ctx.fillRect(28, bar + 18, 14, 14); }
    ptext(ctx, 'REPLAY', 52, bar + 14, 3, '#fff', 'left');
    const n = R.ring.length + HOLD; ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, H - 4, W, 4); ctx.fillStyle = '#ff3b3b'; ctx.fillRect(0, H - 4, Math.round(W * clamp(R.i / n, 0, 1)), 4);
    if (R.t > GRACE) ptext(ctx, 'ANY BUTTON SKIPS', W / 2, H - bar + 12, 2, blink ? '#fff' : '#aab', 'center');
  }
  HOOKS.add('drawTop', (ctx, g) => {
    if (S.stash) { if (!g.banner) g.banner = S.stash; S.stash = null; }
    if (g.phase === 'pause') return;
    drawReplayTop(ctx);
    drawCut(ctx);
  });

  window.VFX = {
    tiers: TIERS, cutLen: CUT_LEN, slowLen: SLOW_LEN, replayLen: REPLAY_LEN, tail: TAIL, grace: GRACE, hold: HOLD, impactLen: IMPACT_LEN,
    tierOf, skipReplay() { if (R.on) R.skip = true; },
    levels: () => ({ flash: flashLevel(), shake: shakeLevel() }),
    state() {
      return {
        cut: S.cut ? { t: S.cut.t, name: S.cut.name, label: S.cut.label } : null, impact: S.impact ? S.impact.t : -1, slow: S.slow ? S.slow.n : -1, punch: S.punch ? S.punch.t : -1,
        replay: R.on ? { i: R.i, t: R.t, n: R.ring.length } : null, recorded: R.ring.length, pending: R.pending, stopped: R.stopped, plays: R.plays, skips: R.skips, sparks: S.sparks.length
      };
    }
  };
})();

</script>
